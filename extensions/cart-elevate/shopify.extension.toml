# CartElevate — Shopify Theme App Extension
# App Embed Block: injects CartElevate widgets into the merchant's cart.
# Merchants enable this once: Theme Editor → Customize → App Embeds → CartElevate → ON

api_version = "2024-04"

[[extensions]]
type = "theme"
name = "CartElevate"
handle = "cart-elevate"
uid = "88294ee2-0775-d45d-3dba-ca279b729312e1ae400b"

[extensions.build]
# Build command runs from this extension directory (extensions/cart-elevate/)
# ../../cart-elevate-src/ is the React source directory
command = "npm --prefix ../../cart-elevate-src run build"
watch_dirs = []
